[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simlife"
version = "0.1.0"
description = "Colony life simulation: tiny networks, shared fate, no fitness function"
requires-python = ">=3.12"
dependencies = ["jax>=0.12", "numpy", "websockets"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["engine"]
include = ["simlife*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine/tests"]
asyncio_mode = "auto"
markers = ["slow: long-running simulation tests (deselected by default)"]
addopts = "-m 'not slow'"
